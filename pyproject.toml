[project]
name = "agentic-ai-starter"
version = "0.1.0"
description = "Teaching-ready Agentic AI starter: FastAPI, LLM, tools, memory, PostgreSQL, RAG, tests."
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "openai>=1.60",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
