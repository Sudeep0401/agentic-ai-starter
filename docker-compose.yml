services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic-ai-postgres
    environment:
      POSTGRES_USER: agentuser
      POSTGRES_PASSWORD: agentpass
      POSTGRES_DB: agentdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentuser -d agentdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: agentic-ai-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://agentuser:agentpass@postgres:5432/agentdb
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
